<div class="modegrid">
<button class="mode" onclick="begin('project')"><strong>${labels.en.project}</strong><span>${T("Project knowledge and disaster-response decisions.","प्रोजेक्ट और आपदा-प्रतिक्रिया से जुड़े निर्णय।")}</span></button>
<button class="mode" onclick="begin('business')"><strong>${labels.en.business}</strong><span>${T("Business thinking, customers, innovation and growth.","बिजनेस, ग्राहक, innovation और growth thinking।")}</span></button>
<button class="mode" onclick="begin('career')"><strong>${labels.en.career}</strong><span>${T("Explore interests and receive a future-direction profile.","अपनी रुचियां जानें और future-direction profile पाएं।")}</span></button></div>
<button onclick="login()">ADMIN CONTROL CENTER</button></section>`}
function begin(type){s.lang=document.getElementById("lang").value;s.name=document.getElementById("name").value.trim()||"TRĀTA Visitor";s.type=type;s.i=0;s.score=0;s.answers=[];s.career={tech:0,creative:0,people:0,business:0};s.other="";renderQ()}
function renderQ(){
let q=BANK[s.type][s.lang][s.i];app.innerHTML=`<section class="panel"><div class="top"><span class="pill">${labels[s.lang][s.type]}</span><span class="pill">${s.i+1} / ${BANK[s.type][s.lang].length}</span></div><div class="bar"><i style="width:${s.i/BANK[s.type][s.lang].length*100}%"></i></div><div class="question">${q[0]}</div><div id="choices">${q[1].map((x,n)=>`<button class="choice" onclick="answer(${n})">${String.fromCharCode(65+n)}. ${x}</button>`).join("")}<button class="choice secondary" onclick="otherAnswer()">${T("OTHER — write your own response","अन्य — अपना जवाब लिखें")}</button></div><p class="muted" style="font-size:12px">${T("Select one response. The next mission opens automatically.","एक उत्तर चुनें। अगला प्रश्न अपने आप खुलेगा।")}</p></section>`}
function otherAnswer(){
app.innerHTML=`<section class="panel"><span class="pill">${labels[s.lang][s.type]}</span><h2>${T("Your own response","आपका अपना जवाब")}</h2><p class="sub">${T("Tell TRĀTA what you would choose or what you think.","TRĀTA को बताएं कि आप क्या चुनेंगे या आपकी राय क्या है।")}</p><div class="field"><textarea id="other" placeholder="${T("Write your opinion...","अपनी राय लिखें...")}"></textarea></div><div class="row"><button class="primary" onclick="submitOther()">${T("SUBMIT & CONTINUE","जमा करें और आगे बढ़ें")}</button><button onclick="renderQ()">${T("BACK","वापस")}</button></div></section>`}
function submitOther(){s.answers.push({q:s.i+1,a:"other",text:document.getElementById("other").value.trim()||"No written response"});s.i++;if(s.i<BANK[s.type][s.lang].length)renderQ();else finish()}
function answer(n){
let q=BANK[s.type][s.lang][s.i];if(s.type==="career"){s.career[careerMap[n]]++;s.answers.push({q:s.i+1,a:n})}else{if(n===q[2])s.score++;s.answers.push({q:s.i+1,a:n,ok:n===q[2]})}
document.querySelectorAll(".choice").forEach(b=>b.disabled=true);setTimeout(()=>{s.i++;if(s.i<BANK[s.type][s.lang].length)renderQ();else finish()},430)}
function save(r){let h=JSON.parse(localStorage.getItem("trataHistory")||"[]");r.id="TRATA-"+Date.now().toString(36).toUpperCase();r.date=new Date().toLocaleString();h.unshift(r);localStorage.setItem("trataHistory",JSON.stringify(h.slice(0,150)));return r}
function finish(){
if(s.type==="career")return careerResult();
let total=BANK[s.type][s.lang].length,pct=Math.round(s.score/total*100);let r=save({type:s.type,name:s.name,lang:s.lang,score:s.score,total,pct,answers:s.answers});let title=s.type==="business"?T("BUSINESS FUTURE REPORT","बिजनेस फ्यूचर रिपोर्ट"):T("TRĀTA MISSION REPORT","TRĀTA मिशन रिपोर्ट");
app.innerHTML=`<section class="panel"><span class="pill">${T("ANALYSIS COMPLETE","विश्लेषण पूरा")}</span><h2 style="text-align:center">${title}</h2><p class="sub" style="text-align:center">${esc(s.name)}</p><div class="score">${pct}%</div><div class="graph">${[s.score,total-s.score,Math.max(1,Math.round(pct*.8)),Math.max(1,Math.round(pct*.6)),Math.max(1,Math.round(pct*.9))].map(v=>`<span style="height:${Math.max(10,Math.min(100,v/total*100))}%"></span>`).join("")}</div><div class="stats"><div class="stat"><b>${s.score}/${total}</b>${T("Correct responses","सही उत्तर")}</div><div class="stat"><b>${pct}%</b>${T("Overall score","कुल स्कोर")}</div><div class="stat"><b>${r.id}</b>${T("Mission ID","मिशन ID")}</div></div>${s.type==="business"?businessInsights(pct):projectInsights(pct)}<div class="row"><button class="primary" onclick="certificate('${r.id}')">${T("GENERATE CERTIFICATE","सर्टिफिकेट बनाएं")}</button><button onclick="home()">${T("NEW EXPERIENCE","नया अनुभव")}</button></div></section>`}
function projectInsights(pct){return `<div class="panel" style="padding:18px"><h3>${T("TRĀTA Response Profile","TRĀTA प्रतिक्रिया प्रोफाइल")}</h3><div class="metric"><div class="metricHead"><span>${T("Situational awareness","स्थिति की समझ")}</span><b>${Math.min(100,pct+5)}%</b></div><div class="metricBar"><i style="width:${Math.min(100,pct+5)}%"></i></div></div><div class="metric"><div class="metricHead"><span>${T("Decision making","निर्णय क्षमता")}</span><b>${pct}%</b></div><div class="metricBar"><i style="width:${pct}%"></i></div></div><p class="muted">${T("This is an educational quiz profile, not a professional qualification.","यह शैक्षिक quiz profile है, कोई professional qualification नहीं।")}</p></div>`}
function businessInsights(pct){
let growth=Math.round(35+pct*.55),customers=Math.round(10+pct*.9),low=Math.round(customers*.5),high=Math.round(customers*2.2);return `<div class="panel" style="padding:18px"><h3>${T("Business Opportunity Snapshot","बिजनेस अवसर स्नैपशॉट")}</h3><p class="sub">${T("Illustrative estimates based only on quiz responses; they are not guarantees of income or growth.","ये केवल quiz responses पर आधारित illustrative estimates हैं; income या growth की guarantee नहीं हैं।")}</p><div class="stats"><div class="stat"><b>${growth}%</b>${T("Opportunity-readiness index","अवसर तैयारी सूचकांक")}</div><div class="stat"><b>${customers}</b>${T("Illustrative monthly customers","उदाहरणात्मक मासिक ग्राहक")}</div><div class="stat"><b>₹${low}k–₹${high}k</b>${T("Illustrative monthly revenue range","उदाहरणात्मक मासिक revenue range")}</div></div><div class="metric"><div class="metricHead"><span>${T("Validation readiness","Validation readiness")}</span><b>${Math.min(100,pct+10)}%</b></div><div class="metricBar"><i style="width:${Math.min(100,pct+10)}%"></i></div></div><div class="metric"><div class="metricHead"><span>${T("Adaptability","Adaptability")}</span><b>${Math.min(100,pct+3)}%</b></div><div class="metricBar"><i style="width:${Math.min(100,pct+3)}%"></i></div></div></div>`}
function careerResult(){
let c=s.career,arr=Object.entries(c).sort((a,b)=>b[1]-a[1]),top=arr[0][0],names={tech:["Technology & Engineering","टेक्नोलॉजी और इंजीनियरिंग"],creative:["Design & Digital Creation","डिजाइन और डिजिटल क्रिएशन"],people:["Research, Education & Social Impact","रिसर्च, शिक्षा और सामाजिक प्रभाव"],business:["Business, Leadership & Entrepreneurship","बिजनेस, नेतृत्व और उद्यमिता"]};let p=T(names[top][0],names[top][1]);let detail={tech:T("Possible directions: robotics, electronics, software, automation and engineering.","संभावित दिशाएं: robotics, electronics, software, automation और engineering।"),creative:T("Possible directions: UI/UX, product design, graphics, animation and digital media.","संभावित दिशाएं: UI/UX, product design, graphics, animation और digital media।"),people:T("Possible directions: research, education, science communication and social-impact work.","संभावित दिशाएं: research, education, science communication और social-impact work।"),business:T("Possible directions: entrepreneurship, product strategy, management and innovation.","संभावित दिशाएं: entrepreneurship, product strategy, management और innovation।")}[top];let r=save({type:"career",name:s.name,lang:s.lang,score:0,total:10,pct:0,profile:p,answers:s.answers,career:c});app.innerHTML=`<section class="panel"><span class="pill">${T("CAREER ANALYSIS COMPLETE","करियर विश्लेषण पूरा")}</span><h2>${p}</h2><p class="sub">${detail}</p><div class="stats">${Object.entries(c).map(([k,v])=>`<div class="stat"><b>${v}</b>${k}</div>`).join("")}</div><div class="graph">${Object.values(c).map(v=>`<span style="height:${Math.max(12,v/10*100)}%"></span>`).join("")}</div><div class="panel" style="padding:18px"><h3>${T("Future Direction","भविष्य की दिशा")}</h3><p class="sub">${detail}</p><p class="muted">${T("Career guidance is exploratory, not a prediction or guaranteed outcome.","यह career guidance exploratory है, भविष्यवाणी या guarantee नहीं।")}</p></div><div class="row"><button class="primary" onclick="certificate('${r.id}')">${T("GENERATE CERTIFICATE","सर्टिफिकेट बनाएं")}</button><button onclick="home()">${T("NEW EXPERIENCE","नया अनुभव")}</button></div></section>`}
function certificate(id){
let h=JSON.parse(localStorage.getItem("trataHistory")||"[]"),r=h.find(x=>x.id===id),career=r.type==="career";let title=career?(r.lang==="hi"?"करियर एक्सप्लोरेशन सर्टिफिकेट":"CAREER EXPLORATION CERTIFICATE"):(r.type==="business"?(r.lang==="hi"?"बिजनेस चैलेंज सर्टिफिकेट":"BUSINESS CHALLENGE CERTIFICATE"):(r.lang==="hi"?"TRĀTA मिशन पूर्णता प्रमाणपत्र":"TRĀTA MISSION COMPLETION CERTIFICATE"));
app.innerHTML=`<section class="panel"><div class="certificate" id="certificate"><div class="certinner"><div class="certbadge">BADGE OF TRĀTA TEAM</div><div class="certsmall">AUTONOMOUS DISASTER RESPONSE & RESCUE SYSTEM</div><h2>TRĀTA</h2><h3>${title}</h3><p>${r.lang==="hi"?"यह प्रमाणपत्र प्रस्तुत किया जाता है":"This certificate is presented to"}</p><h1>${esc(r.name)}</h1><p>${career?(r.lang==="hi"?"TRĀTA Career Explorer पूरा करने के लिए।":"for completing the TRĀTA Career Explorer."):(r.lang==="hi"?"TRĀTA Interactive Challenge सफलतापूर्वक पूरा करने के लिए।":"for completing the TRĀTA Interactive Challenge.")}</p>${career?`<p><b>${esc(r.profile)}</b></p>`:`<div class="stats"><div class="stat"><b>${r.pct}%</b>Score</div><div class="stat"><b>${r.score}/${r.total}</b>Correct</div></div>`}<div class="certseal">TRĀTA<br>VERIFIED</div><p class="certsmall">${esc(r.date)} • ${esc(r.id)}</p></div></div><div class="row no-print" style="margin-top:18px"><button class="primary" onclick="downloadCert('${r.id}')">${r.lang==="hi"?"सर्टिफिकेट डाउनलोड करें":"DOWNLOAD CERTIFICATE"}</button><button onclick="window.print()">${r.lang==="hi"?"PDF में Save करें":"SAVE AS PDF"}</button><button onclick="login()">ADMIN HISTORY</button></div></section>`}
function downloadCert(id){let h=JSON.parse(localStorage.getItem("trataHistory")||"[]"),r=h.find(x=>x.id===id),node=document.getElementById("certificate");let w=window.open("","_blank");if(!w){alert("Chrome में pop-up allow करें.");return}w.document.write(`<html><head><title>${r.id}</title><style>body{margin:0;background:white;font-family:Arial;color:#14212a}.certificate{margin:20px;padding:9px;border:8px double #08758b;text-align:center;background:linear-gradient(135deg,#071a2c,#eafcff 46%,#d8f7ff)}.certinner{min-height:650px;border:1px solid #08758b;padding:35px 18px;display:flex;flex-direction:column;justify-content:center}.certificate h2{font-size:40px;color:#08758b;letter-spacing:4px}.certificate h1{font-size:46px;color:#07566a}.certbadge{display:inline-block;margin:8px auto 18px;padding:9px 15px;border:2px solid #08758b;border-radius:50px;color:#08758b;font-weight:900;letter-spacing:2px}.certseal{width:70px;height:70px;border:3px solid #08758b;border-radius:50%;display:grid;place-items:center;margin:15px auto;color:#08758b;font-weight:900;font-size:10px}</style></head><body>${node.outerHTML}<script>setTimeout(()=>window.print(),350)<\/script></body></html>`);w.document.close()}
function login(){app.innerHTML=`<section class="panel" style="max-width:520px;margin:auto"><span class="pill">TRĀTA ADMIN</span><h2>CONTROL CENTER</h2><div class="field"><label>ADMIN PASSWORD</label><input id="pass" type="password" placeholder="Enter password"></div><button class="primary" onclick="admin()">LOGIN</button><button onclick="home()" style="margin-left:8px">BACK</button></section>`}
function admin(){if(document.getElementById("pass").value!=="UTKARSH"){alert("Access denied");return}let h=JSON.parse(localStorage.getItem("trataHistory")||"[]");app.innerHTML=`<section class="panel"><div class="top"><div><span class="pill">ADMIN MODE</span><h2>TRĀTA CONTROL CENTER</h2></div><button onclick="home()">EXIT</button></div><div class="stats"><div class="stat"><b>${h.length}</b>Participants</div><div class="stat"><b>${h.filter(x=>x.type==="project").length}</b>Project</div><div class="stat"><b>${h.filter(x=>x.type==="business").length}</b>Business</div><div class="stat"><b>${h.filter(x=>x.type==="career").length}</b>Career</div></div><div class="scroll">${h.length?`<table><tr><th>Name</th><th>Type</th><th>Result</th><th>Certificate</th><th>Date</th></tr>${h.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${x.pct?x.pct+"%":esc(x.profile||"—")}</td><td><button onclick="certificate('${x.id}')">OPEN</button></td><td>${esc(x.date)}</td></tr>`).join("")}</table>`:"<p class='muted'>No history yet.</p>"}</div><div class="row" style="margin-top:18px"><button onclick="exportCSV()">EXPORT HISTORY CSV</button><button class="danger" onclick="if(confirm('Clear all history?')){localStorage.removeItem('trataHistory');admin()}">CLEAR HISTORY</button></div></section>`}
function exportCSV(){let h=JSON.parse(localStorage.getItem("trataHistory")||"[]"),csv="Name,Type,Score,Total,Percentage,Profile,Date,ID\n"+h.map(x=>[x.name,x.type,x.score||"",x.total||"",x.pct||"",x.profile||"",x.date,x.id].map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="TRATA_History.csv";a.click()}
home();
</script></body></html>
