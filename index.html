<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030812"><title>TRATA Quiz</title>
<style>
:root{--bg:#030812;--p:#07182b;--p2:#0a2038;--cyan:#00d9ff;--purple:#8a6cff;--text:#effcff;--muted:#91afbf;--good:#48f0a8;--bad:#ff5d79}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#08304a55,transparent 30%),radial-gradient(circle at 85% 75%,#452b7750,transparent 32%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif;overflow-x:hidden}.grid{position:fixed;inset:0;z-index:-1;opacity:.3;background-image:linear-gradient(#00d9ff0b 1px,transparent 1px),linear-gradient(90deg,#00d9ff0b 1px,transparent 1px);background-size:44px 44px;transform:perspective(600px) rotateX(58deg) translateY(28%);animation:grid 15s linear infinite}@keyframes grid{to{background-position:0 44px,44px 0}}.orb{position:fixed;width:180px;height:180px;border:1px solid #00d9ff2b;border-radius:50%;z-index:-1;animation:float 10s ease-in-out infinite}.o1{left:4%;top:18%}.o2{right:7%;top:16%;animation-delay:-4s}.o3{right:20%;bottom:5%;animation-delay:-7s}@keyframes float{50%{transform:translate(35px,-30px) scale(1.2);opacity:.45}}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:13px 20px;background:#030812dd;border-bottom:1px solid #00d9ff22;backdrop-filter:blur(18px)}.brand{font-weight:950;letter-spacing:.12em;cursor:pointer;display:flex;align-items:center;gap:9px}.mark{width:38px;height:38px;border:1px solid var(--cyan);border-radius:11px;display:grid;place-items:center;box-shadow:0 0 25px #00d9ff33}.brand small{font-size:8px;color:var(--muted);letter-spacing:.2em;align-self:flex-end;margin-left:-5px}nav{display:flex;gap:3px;flex:1;overflow:auto}button{font:inherit}nav button,.top button{border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 11px;border-radius:10px;cursor:pointer;white-space:nowrap}nav button:hover,nav button.active,.top button:hover{border-color:#00d9ff55;color:white;background:#00d9ff0b}.top{display:flex;gap:5px}.mobile{display:none}main{max-width:1400px;margin:auto;padding:35px 22px 70px}.hero{min-height:520px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:25px}.k{font-size:11px;letter-spacing:.22em;color:var(--cyan);font-weight:800}.hero h1{font-size:clamp(60px,10vw,120px);line-height:.82;letter-spacing:-.07em;margin:12px 0;background:linear-gradient(90deg,#fff,var(--cyan),var(--purple));-webkit-background-clip:text;color:transparent}.hero p{max-width:700px;color:var(--muted);font-size:18px;line-height:1.7}.btn{border:1px solid var(--cyan);background:linear-gradient(110deg,#00d9ff1c,#8a6cff16);color:white;padding:12px 17px;border-radius:12px;cursor:pointer;font-weight:850;transition:.22s}.btn:hover{transform:translateY(-3px);box-shadow:0 12px 35px #00d9ff22}.secondary{border-color:#ffffff20;background:#ffffff08}.art{height:430px;display:grid;place-items:center;position:relative}.core{width:220px;height:220px;border:1px solid var(--cyan);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 80px #00d9ff24,inset 0 0 50px #00d9ff10;animation:pulse 4s ease-in-out infinite}.core:before,.core:after{content:"";position:absolute;border:1px dashed #00d9ff38;border-radius:50%;animation:spin 12s linear infinite}.core:before{width:320px;height:320px}.core:after{width:420px;height:420px;animation-direction:reverse;animation-duration:18s}.core b{font-size:40px}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 120px #00d9ff3a}}@keyframes spin{to{transform:rotate(360deg)}}.panel,.card{background:linear-gradient(145deg,#0a2038dd,#061222dd);border:1px solid #00d9ff2d;border-radius:19px;box-shadow:0 25px 70px #0008;backdrop-filter:blur(14px)}.panel{padding:24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:23px;position:relative;overflow:hidden;transition:.3s}.card:hover{transform:translateY(-7px);border-color:#00d9ff88}.card h3{color:var(--cyan);margin:0 0 10px}.card p,.muted{color:var(--muted);line-height:1.65}.section{display:flex;justify-content:space-between;align-items:end;margin:40px 0 16px}.section h2{margin:0;font-size:32px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;border:1px solid #ffffff10;border-radius:14px;background:#ffffff06}.stat b{font-size:28px;display:block}.stat span{font-size:12px;color:var(--muted)}.progress{height:8px;background:#0d1d2d;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:.4s}.quiz{max-width:900px;margin:auto}.meta{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:12px}.question{font-size:31px;line-height:1.25}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.opt{padding:17px;text-align:left;background:#ffffff06;color:white;border:1px solid #ffffff14;border-radius:14px;cursor:pointer;transition:.2s}.opt:hover{border-color:#00d9ff77;transform:translateX(4px)}.opt.good{border-color:var(--good);background:#48f0a814}.opt.bad{border-color:var(--bad);background:#ff5d7914}.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bars{height:210px;display:flex;align-items:end;gap:9px;padding:15px}.bar{flex:1;min-width:10px;background:linear-gradient(180deg,var(--cyan),var(--purple));border-radius:8px 8px 2px 2px;position:relative;animation:rise .7s ease both}.bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}@keyframes rise{from{height:0;opacity:0}}.swipe{overflow:hidden;touch-action:pan-y}.track{display:flex;transition:transform .45s cubic-bezier(.2,.8,.2,1)}.slide{min-width:100%;padding:2px}.dots{text-align:center}.dot{display:inline-block;width:7px;height:7px;background:#284052;border-radius:50%;margin:4px}.dot.on{background:var(--cyan);box-shadow:0 0 12px var(--cyan)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #ffffff0d}.table th{color:var(--cyan)}.cert{max-width:900px;margin:auto;padding:48px;text-align:center;border:2px solid #00d9ff77;background:linear-gradient(145deg,#091c30,#030b16);position:relative}.seal{width:90px;height:90px;border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;margin:auto;color:var(--cyan);font-weight:900;box-shadow:0 0 30px #00d9ff33}.cert h2{font-size:37px;margin:16px}.cert h3{color:var(--cyan)}.footer{display:flex;justify-content:space-between;padding:18px 22px;border-top:1px solid #00d9ff17;color:var(--muted);font-size:12px}.boot{position:fixed;inset:0;z-index:100;background:#020711;display:grid;place-content:center;text-align:center;gap:12px}.ring{width:58px;height:58px;border:2px solid #ffffff15;border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:auto}.boot strong{font-size:42px;color:var(--cyan);letter-spacing:.14em}.toast{position:fixed;right:18px;bottom:18px;background:#092039;border:1px solid var(--cyan);padding:13px 16px;border-radius:10px;transform:translateY(150%);transition:.3s;z-index:50}.toast.show{transform:translateY(0)}@media(max-width:950px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.chartgrid{grid-template-columns:1fr}}@media(max-width:700px){nav{display:none}nav.open{display:flex;position:absolute;top:65px;left:0;right:0;background:#030812f7;padding:10px;flex-wrap:wrap}.mobile{display:block}.cards,.opts{grid-template-columns:1fr}.hero{min-height:auto}.art{height:300px}.core{width:150px;height:150px}.core:before{width:220px;height:220px}.core:after{width:280px;height:280px}.question{font-size:25px}.footer{flex-direction:column;gap:7px}}
</style></head><body><div class="grid"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div id="boot" class="boot"><div class="ring"></div><strong>TRATA</strong><span>Initializing Quiz System...</span></div>
<header><div class="brand" onclick="go('home')"><span class="mark">T</span><span>TRATA</span><small>QUIZ</small></div><nav id="nav"><button data-page="home">Home</button><button data-page="quiz">Quiz</button><button data-page="project">Project</button><button data-page="business">Business Challenge</button><button data-page="career">Career Explorer</button><button data-page="history">History</button><button data-page="admin">Admin</button></nav><div class="top"><button id="lang">हिन्दी</button><button id="sound">SOUND ON</button><button class="mobile" id="menu">☰</button></div></header><main id="app"></main><footer class="footer"><span>TRATA • Autonomous Disaster Response & Rescue System</span><span>Science • Robotics • Innovation</span></footer><div id="toast" class="toast"></div>
<script>
const ADMIN_PASSWORD='9451968246';let lang=localStorage.getItem('trata_lang')||'en',user=JSON.parse(localStorage.getItem('trata_user')||'null'),page='home',quiz=null,biz=null,careerState=null,records=JSON.parse(localStorage.getItem('trata_records')||'[]');
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const questions=[
['What is the main purpose of an ultrasonic sensor on a rescue rover?',['Measuring distance','Measuring humidity','Measuring battery voltage','Measuring sound volume'],0,'Ultrasonic sensors estimate distance from reflected sound pulses.'],
['Which system lets a rover make programmed movement decisions without continuous steering?',['Autonomous control','Decorative lighting','Audio playback','Certificate printing'],0,'Autonomous control combines sensor input with programmed logic.'],
['Which sensor family is commonly used in educational prototypes for gas or smoke detection?',['MQ-series gas sensor','Servo motor','OLED display','Push button'],0,'MQ-series sensors are commonly used for gas/smoke detection prototypes.'],
['What does a DHT11 commonly measure?',['Temperature and humidity','Distance and angle','Gas pressure only','Motor current only'],0,'DHT11 is a basic temperature and humidity sensor.'],
['Why can a rescue rover be useful in a hazardous area?',['It can inspect an area while keeping people farther from danger','It replaces every emergency service','It guarantees zero risk','It only works indoors'],0,'Robotic inspection can reduce the need to immediately send a person into a hazardous area.'],
['What is the role of a motor driver in a small rover?',['It interfaces the controller with the motors','It stores quiz results','It translates languages','It generates certificates'],0,'A motor driver provides the switching/interface needed between a controller and motors within its limits.']];
function save(){localStorage.setItem('trata_records',JSON.stringify(records));localStorage.setItem('trata_user',JSON.stringify(user))}function toast(x){let e=$('#toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function go(p){page=p;render();scrollTo({top:0,behavior:'smooth'})}function ensure(){if(user?.name)return true;let n=prompt(lang==='hi'?'अपना नाम दर्ज करें':'Enter your name');if(!n?.trim())return false;user={id:crypto.randomUUID(),name:n.trim()};save();return true}function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){return `<section class="hero"><div><div class="k">AUTONOMOUS DISASTER RESPONSE • LEARNING PLATFORM</div><h1>TRATA<br>QUIZ</h1><p>Explore disaster-response technology, test your knowledge, solve innovation challenges and discover technology areas that match your interests.</p><button class="btn" onclick="go('quiz')">START QUIZ</button> <button class="btn secondary" onclick="go('project')">EXPLORE TRATA</button></div><div class="art"><div class="core"><b>TRATA</b></div></div></section><div class="section"><div><h2>Explore the System</h2><p class="muted">Interactive modules with animated visuals.</p></div></div><div class="cards"><div class="card"><h3>TRATA PROJECT</h3><p>Swipe through project information, rover, drone, sensors, autonomy, rescue workflow and sustainability.</p><button class="btn" onclick="go('project')">EXPLORE PROJECT</button></div><div class="card"><h3>BUSINESS CHALLENGE</h3><p>Work through customer, innovation, sustainability, cost and product decisions.</p><button class="btn" onclick="go('business')">START CHALLENGE</button></div><div class="card"><h3>CAREER EXPLORER</h3><p>Explore interest areas, development areas and animated result graphs.</p><button class="btn" onclick="go('career')">EXPLORE CAREERS</button></div></div><div class="section"><h2>Personal Snapshot</h2></div><div class="stats"><div class="stat"><b>${records.length}</b><span>Saved Records</span></div><div class="stat"><b>${esc(user?.name||'—')}</b><span>Current User</span></div><div class="stat"><b>${records.length?Math.round(records.reduce((a,r)=>a+(r.score||0),0)/records.length):0}%</b><span>Average Score</span></div><div class="stat"><b>EN / HI</b><span>Languages</span></div></div>`}
function startQuiz(){if(!ensure())return;quiz={items:sh(questions).map(q=>{let opts=q[1].map((text,i)=>({text,correct:i===q[2]}));return {q:q[0],opts:sh(opts),e:q[3]}}),i:0,score:0,locked:false,time:25};render();tick()}
function tick(){clearInterval(quiz?.timer);quiz.timer=setInterval(()=>{if(!quiz)return;quiz.time--;let t=$('#timer');if(t)t.textContent='TIME '+quiz.time+'s';if(quiz.time<=0){clearInterval(quiz.timer);answer(-1)}},1000)}
function answer(i){if(!quiz||quiz.locked)return;quiz.locked=true;clearInterval(quiz.timer);let q=quiz.items[quiz.i],correct=q.opts.findIndex(o=>o.correct),chosen=q.opts[i];document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===correct)b.classList.add('good');if(k===i&&!chosen?.correct)b.classList.add('bad')});if(chosen?.correct)quiz.score++;$('#feedback').textContent=q.e+(i<0?' Time expired.':'');$('#next').disabled=false}
function next(){if(quiz.i+1>=quiz.items.length){let score=Math.round(quiz.score/quiz.items.length*100);records.push({type:'quiz',userId:user.id,name:user.name,score,correct:quiz.score,total:quiz.items.length,date:new Date().toISOString()});save();quiz=null;go('history');return}quiz.i++;quiz.locked=false;quiz.time=25;render();tick()}
function quizPage(){if(!quiz)return `<div class="quiz panel"><div class="k">TRATA QUIZ</div><h2>Ready to test your knowledge?</h2><p class="muted">Answer positions are shuffled; correctness follows each option's identity, not position.</p><button class="btn" onclick="startQuiz()">START QUIZ</button></div>`;let q=quiz.items[quiz.i];return `<div class="quiz panel"><div class="meta"><span>QUESTION ${quiz.i+1} / ${quiz.items.length}</span><span id="timer">TIME ${quiz.time}s</span></div><div class="progress"><i style="width:${quiz.i/quiz.items.length*100}%"></i></div><h2 class="question">${esc(q.q)}</h2><div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o.text)}</button>`).join('')}</div><p id="feedback" class="muted"></p><button id="next" class="btn" disabled onclick="next()">NEXT</button></div>`}
const projectSlides=[['OVERVIEW','TRATA is an autonomous disaster-response and rescue technology concept combining mobile robotics, sensing, communication and emergency-support workflows.'],['ROVER','A rescue rover can inspect areas where sending a person immediately may be unsafe. Sensor data can support navigation and situational awareness.'],['DRONE','A drone can provide an elevated view of a disaster area and help responders inspect larger regions before ground deployment.'],['SENSORS','Sensors can monitor distance, temperature, humidity, gas presence, flame indications, pressure and orientation depending on installed hardware.'],['AUTONOMY','Autonomous behavior uses sensor input and programmed rules to make decisions without continuous manual steering.'],['RESCUE WORKFLOW','Detect → assess → navigate → inspect → communicate → support rescue. TRATA is a technology aid, not a replacement for trained responders.'],['SUSTAINABILITY','A modular platform can be repaired, upgraded and adapted instead of replacing the whole system.'],['FUTURE','Future work can explore mapping, stronger communication, computer vision, safer navigation and richer telemetry.']];let pi=0;
function project(){return `<div class="section"><div><div class="k">PROJECT INFORMATION</div><h2>TRATA PROJECT</h2><p class="muted">Swipe left/right or use the controls.</p></div></div><div class="swipe panel"><div id="track" class="track">${projectSlides.map(s=>`<article class="slide"><div class="card" style="min-height:330px"><div class="k">${s[0]}</div><h2>${s[0]}</h2><p style="font-size:18px">${s[1]}</p><div class="stats"><div class="stat"><b>TRATA</b><span>Project</span></div><div class="stat"><b>${projectSlides.indexOf(s)+1}</b><span>Module</span></div></div></div></article>`).join('')}</div></div><div class="dots">${projectSlides.map((_,i)=>`<i class="dot ${i===0?'on':''}"></i>`).join('')}</div><div style="text-align:center"><button class="btn secondary" onclick="slide(-1)">← PREVIOUS</button> <button class="btn" onclick="slide(1)">NEXT →</button></div>`}
function slide(d){pi=Math.max(0,Math.min(projectSlides.length-1,pi+d));$('#track').style.transform=`translateX(-${pi*100}%)`;document.querySelectorAll('.dot').forEach((x,i)=>x.classList.toggle('on',i===pi))}
const bq=[['A disaster team needs a low-cost gas-monitoring rover. What should be understood first?','The real user problem and operating environment'],['A prototype is powerful but too expensive. What should be investigated?','Which features are essential and which can be redesigned'],['A rescue organization wants a demonstration. What makes it useful?','Clear evidence that the system solves a real operational problem'],['A team wants to scale. What should happen first?','Validate reliability, users, costs and deployment requirements'],['A sustainable product is being designed. What matters?','How it can be repaired, reused and responsibly powered']];
function business(){if(!biz)return `<div class="quiz panel"><div class="k">INNOVATION LAB</div><h2>BUSINESS CHALLENGE</h2><p class="muted">Scenario-based challenge with performance breakdown.</p><button class="btn" onclick="startBiz()">START CHALLENGE</button></div>`;let s=bq[biz.i],opts=sh([s[1],'Add decorative features first','Ignore target users','Choose the most expensive component']);return `<div class="quiz panel"><div class="meta"><span>SCENARIO ${biz.i+1} / ${bq.length}</span><span>SCORE ${biz.score}</span></div><h2 class="question">${s[0]}</h2><div class="opts">${opts.map(x=>`<button class="opt" onclick="bizAns(this,${x===s[1]})">${esc(x)}</button>`).join('')}</div><p id="bf" class="muted"></p></div>`}
function startBiz(){if(!ensure())return;biz={i:0,score:0};render()}function bizAns(el,ok){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);el.classList.add(ok?'good':'bad');if(ok)biz.score++;$('#bf').textContent=ok?'Good decision.':'Think about the real user, context and constraints.';setTimeout(()=>{if(biz.i+1>=bq.length){let score=Math.round(biz.score/bq.length*100);records.push({type:'business',userId:user.id,name:user.name,score,date:new Date().toISOString()});save();biz=null;go('history')}else{biz.i++;render()}},700)}
const cq=[['Which activity sounds most interesting?',['Building and testing robots','Writing software','Studying natural phenomena','Designing products'],['Robotics & Automation','Software & AI','Science & Research','Product & Design']],['Which problem would you most like to solve?',['Making machines work automatically','Building an intelligent app','Understanding why something happens','Creating a better physical product'],['Robotics & Automation','Software & AI','Science & Research','Product & Design']],['Which skill would you enjoy developing?',['Electronics and embedded systems','Artificial intelligence','Research methods','Entrepreneurship and product strategy'],['Electronics & Embedded Systems','Software & AI','Science & Research','Entrepreneurship']],['Which project sounds most exciting?',['Autonomous rescue rover','AI assistant','Environmental monitoring system','New technology startup'],['Disaster Technology','Software & AI','Environmental Technology','Entrepreneurship']],['What kind of impact interests you?',['Safer disaster response','Better digital tools','Cleaner technology','New products and businesses'],['Disaster Technology','Software & AI','Environmental Technology','Entrepreneurship']]];
function career(){if(!careerState)return `<div class="quiz panel"><div class="k">INTEREST EXPLORATION</div><h2>CAREER EXPLORER</h2><p class="muted">Interest-based exploration with strengths, development areas and graphs. It is not a psychological assessment or guaranteed career prediction.</p><button class="btn" onclick="startCareer()">START EXPLORER</button></div>`;let q=cq[careerState.i];return `<div class="quiz panel"><div class="meta"><span>INTEREST ${careerState.i+1} / ${cq.length}</span></div><div class="progress"><i style="width:${careerState.i/cq.length*100}%"></i></div><h2 class="question">${q[0]}</h2><div class="opts">${q[1].map((x,i)=>`<button class="opt" onclick="careerAns('${q[2][i].replace(/'/g,"\\'")}')">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join('')}</div></div>`}
function startCareer(){if(!ensure())return;careerState={i:0,s:{}};cq.flatMap(q=>q[2]).forEach(x=>careerState.s[x]=0);render()}function careerAns(area){careerState.s[area]++;if(careerState.i+1>=cq.length){let sorted=Object.entries(careerState.s).sort((a,b)=>b[1]-a[1]),top=sorted[0][0];records.push({type:'career',userId:user.id,name:user.name,profile:top,scores:careerState.s,date:new Date().toISOString()});save();let r={top,s:careerState.s};careerState=null;showCareerResult(r)}else{careerState.i++;render()}}
function showCareerResult(r){let sorted=Object.entries(r.s).sort((a,b)=>b[1]-a[1]),bars=sorted.map(([k,v])=>`<div class="bar" style="height:${Math.max(8,v/5*100)}%"><span>${esc(k.split(' ')[0])}</span></div>`).join('');$('#app').innerHTML=`<div class="panel"><div class="k">YOUR EXPLORATION PROFILE</div><h2>${esc(r.top)}</h2><p class="muted">Your answers suggest an interest in this area. Use the result as a starting point for exploration.</p><div class="chartgrid"><div class="panel"><h3>Interest Graph</h3><div class="bars">${bars}</div></div><div class="panel"><h3>Development Areas</h3><p class="muted">Lower-scoring areas are opportunities to explore through small projects and practice, not permanent weaknesses.</p><ul>${sorted.slice(-3).map(x=>`<li>${esc(x[0])}</li>`).join('')}</ul></div></div><div class="cards" style="margin-top:16px"><div class="card"><h3>PRIMARY INTEREST</h3><p>${esc(r.top)}</p></div><div class="card"><h3>SKILLS TO EXPLORE</h3><p>Build small projects, document experiments, learn fundamentals and seek feedback.</p></div><div class="card"><h3>PROJECT IDEA</h3><p>Design a small TRATA-related prototype connected to your top interest.</p></div></div><br><button class="btn" onclick="go('home')">HOME</button> <button class="btn secondary" onclick="go('history')">VIEW HISTORY</button></div>`}
function history(){let mine=records.filter(r=>!user||r.userId===user.id);return `<div class="section"><div><div class="k">PERSONAL DATA</div><h2>MY HISTORY</h2><p class="muted">Only this logged-in user's records are shown.</p></div></div><div class="panel tablewrap"><table class="table"><tr><th>Type</th><th>Result</th><th>Date</th></tr>${mine.slice().reverse().map(r=>`<tr><td>${r.type}</td><td>${r.type==='career'?esc(r.profile):r.score+'%'}</td><td>${new Date(r.date).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="3">No records yet.</td></tr>'}</table></div>`}
function admin(){let p=prompt('Admin password');if(p!==ADMIN_PASSWORD){toast('Access denied');return home()}let qs=records.filter(r=>r.type==='quiz'),bs=records.filter(r=>r.type==='business'),cs=records.filter(r=>r.type==='career'),avg=a=>a.length?Math.round(a.reduce((s,r)=>s+(r.score||0),0)/a.length):0;return `<div class="section"><div><div class="k">ADMIN COMMAND CENTER</div><h2>TRATA ADMIN</h2><p class="muted">All records available to this demo build.</p></div></div><div class="stats"><div class="stat"><b>${records.length}</b><span>Records</span></div><div class="stat"><b>${new Set(records.map(r=>r.userId)).size}</b><span>Users</span></div><div class="stat"><b>${avg(qs)}%</b><span>Avg Quiz</span></div><div class="stat"><b>${avg(bs)}%</b><span>Avg Business</span></div></div><div class="chartgrid" style="margin-top:16px"><div class="panel"><h3>Quiz Score Graph</h3><div class="bars">${qs.slice(-12).map((r,i)=>`<div class="bar" style="height:${Math.max(6,r.score)}%"><span>${i+1}</span></div>`).join('')||'<span class="muted">No data</span>'}</div></div><div class="panel"><h3>Module Distribution</h3><div class="bars"><div class="bar" style="height:${records.length?Math.max(6,qs.length/records.length*100):6}%"><span>Quiz</span></div><div class="bar" style="height:${records.length?Math.max(6,bs.length/records.length*100):6}%"><span>Biz</span></div><div class="bar" style="height:${records.length?Math.max(6,cs.length/records.length*100):6}%"><span>Career</span></div></div></div></div><div class="panel tablewrap" style="margin-top:16px"><h3>All Records</h3><table class="table"><tr><th>User</th><th>Type</th><th>Result</th><th>Date</th></tr>${records.slice().reverse().map(r=>`<tr><td>${esc(r.name)}</td><td>${r.type}</td><td>${r.type==='career'?esc(r.profile):r.score+'%'}</td><td>${new Date(r.date).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="4">No data</td></tr>'}</table></div><br><button class="btn" onclick="exportData()">EXPORT ADMIN DATA</button>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.download='trata-admin-data.json';a.click()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let views={home,quiz:quizPage,project,business,career,history,admin};$('#app').innerHTML=views[page]();if(page==='project'){let sx=0;$('#track')?.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});$('#track')?.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)slide(d<0?1:-1)},{passive:true})}}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p)go(p.dataset.page)});$('#lang').onclick=()=>{lang=lang==='en'?'hi':'en';localStorage.setItem('trata_lang',lang);toast(lang==='hi'?'हिन्दी चुनी गई':'English selected')};$('#sound').onclick=()=>toast('Sound control ready');$('#menu').onclick=()=>$('#nav').classList.toggle('open');setTimeout(()=>{$('#boot').style.display='none';render()},900);
</script></body></html>
