<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRATA Quiz</title>
<style>
:root{--bg:#020712;--p:#071a2d;--c:#00e5ff;--v:#9b6cff;--t:#effcff;--m:#8da8b8;--g:#42f5a7;--r:#ff5d79}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden}
#fx{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 15% 20%,#00e5ff18,transparent 28%),radial-gradient(circle at 85% 70%,#9b6cff18,transparent 30%),#020712}
.grid{position:absolute;inset:-40%;background:linear-gradient(#00e5ff08 1px,transparent 1px),linear-gradient(90deg,#00e5ff08 1px,transparent 1px);background-size:46px 46px;transform:perspective(600px) rotateX(60deg) translateY(20%);animation:grid 12s linear infinite}@keyframes grid{to{background-position:0 46px,46px 0}}
.p{position:absolute;border:1px solid #00e5ff44;border-radius:50%;animation:float 12s linear infinite}@keyframes float{from{transform:translateY(110vh);opacity:0}15%{opacity:.7}to{transform:translate(80px,-20vh);opacity:0}}
.scan{position:fixed;z-index:10;left:0;right:0;top:-2px;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.25;animation:scan 6s linear infinite}@keyframes scan{to{top:100%}}
header{position:sticky;top:0;z-index:9;background:#020712cc;backdrop-filter:blur(18px);border-bottom:1px solid #00e5ff20}.nav{max-width:1450px;margin:auto;padding:12px 20px;display:flex;gap:14px;align-items:center}.brand{display:flex;gap:9px;align-items:center;font-weight:900;letter-spacing:.13em;cursor:pointer}.logo{width:40px;height:40px;border:1px solid var(--c);border-radius:12px;display:grid;place-items:center;box-shadow:0 0 25px #00e5ff25}.brand small{display:block;color:var(--m);font-size:8px;letter-spacing:.18em}nav{display:flex;gap:4px;flex:1;overflow:auto}button{font:inherit;cursor:pointer}nav button,.top{background:transparent;color:var(--m);border:1px solid transparent;padding:9px 10px;border-radius:10px;white-space:nowrap}nav button:hover,nav button.active,.top:hover{color:var(--t);border-color:#00e5ff40;background:#00e5ff0c}.top{border-color:#ffffff18}
main{max-width:1450px;margin:auto;padding:35px 22px 70px}.page{animation:in .45s ease}@keyframes in{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.hero{min-height:620px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:25px}.k{font-size:11px;letter-spacing:.23em;color:var(--c);font-weight:900}h1{font-size:clamp(58px,10vw,125px);line-height:.82;letter-spacing:-.07em;margin:15px 0;background:linear-gradient(90deg,#fff,var(--c),#b58cff);-webkit-background-clip:text;color:transparent}h2{font-size:34px;margin:0 0 12px}h3{color:var(--c);margin:0 0 10px}p{color:var(--m);line-height:1.7}.btn{padding:13px 18px;border-radius:12px;border:1px solid var(--c);background:#00e5ff12;color:var(--t);font-weight:800;transition:.25s}.btn:hover{transform:translateY(-3px);box-shadow:0 15px 35px #00e5ff20}.secondary{border-color:#ffffff20;background:#ffffff08}
.art{height:470px;display:grid;place-items:center;position:relative}.core{width:220px;height:220px;border:1px solid var(--c);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 100px #00e5ff25,inset 0 0 60px #00e5ff12;animation:pulse 4s infinite}.core b{font-size:38px}.ring{position:absolute;width:330px;height:330px;border:1px dashed #00e5ff55;border-radius:50%;animation:spin 12s linear infinite}.ring2{position:absolute;width:440px;height:170px;border:1px solid #9b6cff44;border-radius:50%;animation:spin 16s linear infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 140px #00e5ff35}}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{background:linear-gradient(145deg,#071d32e8,#040d19e8);border:1px solid #00e5ff2f;border-radius:19px;padding:24px;box-shadow:0 25px 70px #0008;overflow:hidden;position:relative}.card:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #00e5ff16;border-radius:50%;right:-100px;top:-100px;animation:spin 8s linear infinite}.card:hover{border-color:#00e5ff88;transform:translateY(-5px)}.section{margin-top:35px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;border:1px solid #ffffff12;border-radius:13px;background:#ffffff06}.stat b{display:block;font-size:28px}.stat span{font-size:10px;color:var(--m)}
.quiz{max-width:920px;margin:auto}.meta{display:flex;justify-content:space-between;color:var(--m);font-size:12px;margin-bottom:12px}.progress{height:8px;background:#0b1827;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--v));transition:.4s}.question{font-size:30px;line-height:1.3;margin:25px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{padding:17px;text-align:left;border:1px solid #ffffff15;border-radius:14px;background:#ffffff06;color:var(--t);transition:.2s}.opt:hover{border-color:var(--c);transform:translateX(4px)}.feedback{color:var(--m);min-height:28px;margin-top:15px}
.swipe{overflow:hidden}.track{display:flex;transition:transform .45s ease}.slide{min-width:100%;padding:2px}.dots{text-align:center;margin:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#294154;margin:4px}.on{background:var(--c);box-shadow:0 0 14px var(--c)}
.bars{height:260px;display:flex;align-items:end;gap:9px;padding:30px 8px}.bar{flex:1;min-width:10px;background:linear-gradient(var(--c),var(--v));border-radius:8px 8px 2px 2px;position:relative;animation:rise .7s ease}.bar span{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--m);white-space:nowrap}@keyframes rise{from{height:0!important}}
.result{text-align:center}.ringScore{width:190px;height:190px;border-radius:50%;margin:20px auto;background:conic-gradient(var(--c) var(--score),#102035 0);display:grid;place-items:center;position:relative}.ringScore:after{content:"";position:absolute;inset:13px;border-radius:50%;background:#06101c}.ringScore strong{z-index:1;font-size:40px}.certificate{max-width:950px;margin:25px auto;padding:55px;text-align:center;border:2px solid #00e5ff66;background:linear-gradient(145deg,#082039,#030a14);position:relative}.certificate:before{content:"";position:absolute;inset:14px;border:1px solid #00e5ff25}.seal{width:95px;height:95px;border:2px solid var(--c);border-radius:50%;display:grid;place-items:center;margin:auto;color:var(--c);font-weight:900}.certificate .name{font-size:35px;color:var(--c);font-weight:900}.certmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.certmeta div{padding:12px;border:1px solid #ffffff12;border-radius:10px}.certmeta b{display:block;font-size:20px}.certmeta span{font-size:9px;color:var(--m)}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #ffffff10}.table th{color:var(--c)}.scroll{overflow:auto}.modal{position:fixed;inset:0;z-index:20;background:#000b;backdrop-filter:blur(10px);display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalbox{width:min(480px,100%);padding:25px;background:#071a2d;border:1px solid var(--c);border-radius:18px}input{width:100%;padding:14px;background:#04101c;border:1px solid #00e5ff30;border-radius:10px;color:white}.toast{position:fixed;right:18px;bottom:18px;z-index:30;background:#071d30;border:1px solid var(--c);padding:13px 16px;border-radius:10px;transform:translateY(150%);transition:.3s}.show{transform:none}footer{border-top:1px solid #00e5ff18;padding:20px;color:var(--m);display:flex;justify-content:space-between;font-size:11px}
#loading{position:fixed;inset:0;z-index:50;background:#020712;display:grid;place-items:center}.load{text-align:center}.loader{width:62px;height:62px;border:2px solid #00e5ff18;border-top-color:var(--c);border-radius:50%;animation:spin .8s linear infinite;margin:auto}.load b{display:block;color:var(--c);font-size:44px;letter-spacing:.12em;margin-top:12px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:650px){nav{display:none}.nav.open nav{display:flex;width:100%;flex-wrap:wrap}.nav{flex-wrap:wrap}.cards,.options{grid-template-columns:1fr}.hero{min-height:auto}.art{height:330px}.core{width:160px;height:160px}.ring{width:240px;height:240px}.ring2{width:300px;height:120px}.question{font-size:24px}.certificate{padding:35px 18px}.certmeta{grid-template-columns:1fr}footer{flex-direction:column;gap:8px}}
</style>
</head>
<body>
<div id="fx"><div class="grid"></div></div><div class="scan"></div>
<div id="loading"><div class="load"><div class="loader"></div><b>TRATA</b><div>Initializing Quiz System...</div></div></div>
<header><div class="nav" id="navwrap"><div class="brand" data-page="home"><div class="logo">T</div><div>TRATA<small>QUIZ SYSTEM</small></div></div><nav id="nav"></nav><button class="top" id="lang">हिन्दी</button><button class="top" data-page="admin">🔐 Admin</button><button class="top" id="menu">☰</button></div></header>
<main id="app"></main><footer><span>TRATA • Autonomous Disaster Response & Rescue System</span><span>Science • Robotics • Innovation</span></footer>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modalbox"><h2 id="mtitle">Enter your name</h2><p>Your name will appear on your achievement certificate.</p><input id="name" placeholder="Your name"><div style="display:flex;gap:10px;margin-top:14px"><button class="btn" id="save">Continue</button><button class="btn secondary" id="cancel">Cancel</button></div></div></div>

<script>
const ADMIN_PASSWORD="9451968246",RK="trata_records_v4",UK="trata_user_v4",LK="trata_lang_v4";
const D={en:{home:"Home",quiz:"Quiz",project:"TRATA Project",business:"Business Challenge",career:"Career Explorer",history:"My History",admin:"Admin",start:"START QUIZ",projectBtn:"EXPLORE TRATA",businessBtn:"START BUSINESS CHALLENGE",careerBtn:"START CAREER EXPLORER",result:"RESULT",cert:"VIEW CERTIFICATE",print:"PRINT / SAVE CERTIFICATE"},hi:{home:"होम",quiz:"क्विज़",project:"TRATA प्रोजेक्ट",business:"बिज़नेस चैलेंज",career:"करियर एक्सप्लोरर",history:"मेरी हिस्ट्री",admin:"एडमिन",start:"क्विज़ शुरू करें",projectBtn:"TRATA देखें",businessBtn:"बिज़नेस चैलेंज शुरू करें",careerBtn:"करियर एक्सप्लोरर शुरू करें",result:"परिणाम",cert:"सर्टिफिकेट देखें",print:"प्रिंट / सेव करें"}};
let L=localStorage.getItem(LK)||"en",user=JSON.parse(localStorage.getItem(UK)||"null"),page="home",quiz=null,biz=null,careerState=null,pending=null;
const tr=k=>D[L][k]||k, records=()=>JSON.parse(localStorage.getItem(RK)||"[]"), saveR=r=>{let a=records();a.push(r);localStorage.setItem(RK,JSON.stringify(a))}, esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])), sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(s){let x=document.getElementById("toast");x.textContent=s;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}
function ensure(cb){if(user?.name){cb();return}pending=cb;document.getElementById("modal").classList.add("show");document.getElementById("name").focus()}
function go(p){page=p;quiz=null;biz=null;careerState=null;render();scrollTo(0,0)}
function nav(){document.getElementById("nav").innerHTML=[["home","home"],["quiz","quiz"],["project","project"],["business","business"],["career","career"],["history","history"],["admin","admin"]].map(x=>`<button class="${page==x[0]?"active":""}" data-page="${x[0]}">${tr(x[1])}</button>`).join("");document.getElementById("lang").textContent=L==="en"?"हिन्दी":"English"}
const qs=[
["What is the main purpose of an ultrasonic sensor on a rescue rover?","Measuring distance","Measuring humidity","Measuring battery voltage","Printing results",0],
["Which system allows a rover to make programmed movement decisions?","Autonomous control","Decorative lighting","Certificate printing","Audio playback",0],
["What does a DHT11 commonly measure?","Temperature and humidity","Distance and angle","Gas pressure only","Motor speed only",0],
["Why can a rescue rover be useful in a hazardous area?","It can inspect an area while keeping people farther from danger","It replaces every emergency service","It guarantees zero risk","It only works indoors",0],
["Which sensor family is commonly used for gas or smoke detection in prototypes?","MQ-series gas sensor","Servo motor","OLED display","Push button",0],
["What is the role of a motor driver in a rover?","Interface the controller with motors","Store quiz results","Translate languages","Create certificates",0]
].map(q=>({q:q[0],o:q.slice(1,5),a:q[5]}));
const proj=[
["OVERVIEW","TRATA is an autonomous disaster-response and rescue technology concept combining robotics, sensing, communication and emergency-support workflows."],
["ROVER","A rescue rover can inspect or monitor locations where immediate human entry may be unsafe."],
["DRONE","A drone can provide an elevated view of a disaster area and help responders understand a wider scene."],
["SENSORS","Sensors can monitor distance, temperature, humidity, gas indications, flame indications, pressure and orientation depending on installed hardware."],
["AUTONOMY","Autonomous behavior uses sensor input and programmed rules to make movement decisions without continuous manual steering."],
["RESCUE WORKFLOW","Detect → assess → navigate → inspect → communicate → support rescue. TRATA is a technology aid, not a replacement for trained responders."],
["SUSTAINABILITY","A modular platform can be repaired and upgraded. Reusable hardware and responsible power design can support longer-term development."],
["FUTURE","Future development can explore mapping, stronger communication, computer vision, safer navigation, telemetry and human-robot coordination."]
];
const bq=[
["A disaster-response team needs a low-cost gas-monitoring rover. What should be understood first?","The real user problem and operating environment",["Add decorative features first","Ignore target users","Choose the most expensive component"]],
["A prototype is powerful but too expensive. What should the team investigate?","Which features are essential and which can be redesigned",["Increase the price immediately","Ignore the budget","Remove all useful features"]],
["A rescue organization wants a technology demonstration. What makes it more useful?","Clear evidence that the system solves a real operational problem",["Only a flashy appearance","More unrelated features","A longer presentation without testing"]],
["A team wants to expand its product. What should happen before scaling?","Validate reliability, users, costs and deployment requirements",["Buy everything immediately","Skip testing","Change the product name only"]],
["A sustainable product is being designed. Which question matters?","How the system can be repaired, reused and responsibly powered",["Make it disposable","Add unnecessary parts","Avoid maintenance completely"]]
];
function home(){return `<section class="hero"><div><div class="k">AUTONOMOUS DISASTER RESPONSE • LEARNING PLATFORM</div><h1>TRATA<br>QUIZ</h1><p>Explore robotics, disaster-response technology, innovation and future-focused problem solving through interactive modules.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-page="quiz">${tr("start")}</button><button class="btn secondary" data-page="project">${tr("projectBtn")}</button><button class="btn secondary" id="homeLang">🌐 ${L==="en"?"हिन्दी":"English"}</button><button class="btn secondary" data-page="admin">🔐 ${tr("admin")}</button></div></div><div class="art"><div class="ring"></div><div class="ring2"></div><div class="core"><b>TRATA</b></div></div></section><section class="section"><div class="panel"><div class="k">QUICK SETTINGS</div><h2>Language & Admin</h2><p>Select your interface language or open the TRATA Admin Command Center.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="homeLang2">🌐 ${L==="en"?"Switch to Hindi":"Switch to English"}</button><button class="btn secondary" data-page="admin">🔐 Open Admin</button></div></div></section><section class="section"><div class="cards"><article class="card"><h3>${tr("project")}</h3><p>Swipe through rover, drone, sensors, autonomy, rescue workflow and future development.</p><button class="btn" data-page="project">${tr("projectBtn")}</button></article><article class="card"><h3>${tr("business")}</h3><p>Complete all scenarios first; the detailed result appears only after the final answer.</p><button class="btn" data-page="business">${tr("businessBtn")}</button></article><article class="card"><h3>${tr("career")}</h3><p>Explore your technology interests with a visual graph and development areas.</p><button class="btn" data-page="career">${tr("careerBtn")}</button></article></div></section>`}
function quizPage(){if(!quiz)return `<div class="panel quiz"><div class="k">TRATA QUIZ</div><h2>Ready to test your knowledge?</h2><p>Questions and options are randomized. Correctness follows the option identity, not its displayed position.</p><button class="btn" id="startQuiz">${tr("start")}</button></div>`;let q=quiz.items[quiz.i];return `<div class="panel quiz"><div class="meta"><span>QUESTION ${quiz.i+1}/${quiz.items.length}</span><span>${quiz.time}s</span></div><div class="progress"><i style="width:${quiz.i/quiz.items.length*100}%"></i></div><h2 class="question">${esc(q.q)}</h2><div class="options">${q.o.map((o,i)=>`<button class="opt" data-qi="${i}">${String.fromCharCode(65+i)}. ${esc(o.text)}</button>`).join("")}</div><div class="feedback" id="fb"></div><button class="btn" id="next" disabled>${quiz.i==quiz.items.length-1?"FINISH QUIZ":tr("next")||"NEXT"}</button></div>`}
function startQuiz(){ensure(()=>{quiz={items:sh(qs).map(q=>{let o=sh(q.o.map((text,i)=>({text,correct:i===q.a})));return{q:q.q,o}}),i:0,score:0,time:20,lock:false};render();tick()})}
function tick(){clearInterval(quiz.timer);quiz.time=20;quiz.timer=setInterval(()=>{quiz.time--;let e=document.querySelector(".meta span:last-child");if(e)e.textContent=quiz.time+"s";if(quiz.time<=0){clearInterval(quiz.timer);answer(-1)}},1000)}
function answer(i){if(quiz.lock)return;quiz.lock=true;clearInterval(quiz.timer);let q=quiz.items[quiz.i],good=q.o.findIndex(x=>x.correct);if(i>=0&&q.o[i].correct)quiz.score++;document.querySelectorAll(".opt").forEach(x=>x.disabled=true);document.getElementById("fb").textContent="Answer recorded. The explanation is shown after the question.";document.getElementById("next").disabled=false}
function nextQ(){if(!quiz.lock)return;if(quiz.i<quiz.items.length-1){quiz.i++;quiz.lock=false;render();tick()}else finishQuiz()}
function finishQuiz(){clearInterval(quiz.timer);let score=Math.round(quiz.score/quiz.items.length*100),r={name:user.name,score,correct:quiz.score,total:quiz.items.length,date:new Date().toLocaleDateString()};saveR({type:"quiz",userId:user.id,name:user.name,score,correct:quiz.score,total:quiz.items.length,date:new Date().toISOString()});quiz=null;document.getElementById("app").innerHTML=`<div class="page result"><div class="panel"><div class="k">${tr("result")}</div><div class="ringScore" style="--score:${score}%"><strong>${score}%</strong></div><h2>Quiz Completed</h2><p>${r.correct}/${r.total} answers correct.</p><button class="btn" id="certBtn">${tr("cert")}</button><div id="cert"></div></div></div>`;document.getElementById("certBtn").onclick=()=>document.getElementById("cert").innerHTML=certificate(r)}
function certificate(r){return `<div class="certificate"><div class="seal">TRATA</div><div class="k" style="margin-top:18px">TRATA QUIZ ACHIEVEMENT</div><h2>CERTIFICATE OF ACHIEVEMENT</h2><p>This certificate is presented to</p><div class="name">${esc(r.name)}</div><p>for successfully completing the TRATA Quiz and demonstrating engagement with robotics, disaster-response technology, science and innovation.</p><div class="certmeta"><div><b>${r.score}%</b><span>SCORE</span></div><div><b>${r.correct}/${r.total}</b><span>CORRECT ANSWERS</span></div><div><b>${r.date}</b><span>COMPLETION DATE</span></div></div><p>This is an application/project achievement certificate. It does not claim government or professional accreditation.</p><button class="btn" onclick="window.print()">${tr("print")}</button></div>`}
function project(){return `<div class="section"><div class="k">PROJECT INFORMATION</div><h2>${tr("project")}</h2><p>Swipe or use the buttons to explore.</p><div class="panel swipe"><div class="track" id="track">${proj.map((x,i)=>`<article class="slide"><div class="card" style="min-height:340px"><div class="k">MODULE ${i+1}</div><h2>${x[0]}</h2><p style="font-size:18px">${x[1]}</p></div></article>`).join("")}</div></div><div class="dots">${proj.map((_,i)=>`<i class="dot ${i?"":"on"}"></i>`).join("")}</div><div style="text-align:center"><button class="btn secondary" id="prev">←</button> <button class="btn" id="nxt">→</button></div></div>`}
function business(){if(!biz)return `<div class="panel quiz"><div class="k">INNOVATION LAB</div><h2>${tr("business")}</h2><p>Complete the entire challenge. <b>No correct/wrong feedback will appear while answering.</b> Your result is calculated only after the final scenario.</p><button class="btn" id="startBiz">${tr("businessBtn")}</button></div>`;let q=biz.items[biz.i];return `<div class="panel quiz"><div class="meta"><span>SCENARIO ${biz.i+1}/${biz.items.length}</span><span>SCORE: ${biz.score}</span></div><div class="progress"><i style="width:${biz.i/biz.items.length*100}%"></i></div><h2 class="question">${esc(q.q)}</h2><div class="options">${q.o.map((o,i)=>`<button class="opt bo" data-c="${o.correct}">${String.fromCharCode(65+i)}. ${esc(o.text)}</button>`).join("")}</div><p>Choose an option to continue. Your performance summary appears after completion.</p></div>`}
function startBiz(){ensure(()=>{biz={items:sh(bq).map(q=>({q:q[0],o:sh([{text:q[1],correct:true},...q[2].map(x=>({text:x,correct:false}))])})),i:0,score:0};render()}
function bizAnswer(b){biz.score+=b.dataset.c==="true"?1:0;if(biz.i<biz.items.length-1){biz.i++;render()}else finishBiz()}
function finishBiz(){let s=Math.round(biz.score/biz.items.length*100),r={score:s,correct:biz.score,total:biz.items.length};saveR({type:"business",userId:user.id,name:user.name,score:s,date:new Date().toISOString()});biz=null;document.getElementById("app").innerHTML=`<div class="page result"><div class="panel"><div class="k">${tr("result")}</div><div class="ringScore" style="--score:${s}%"><strong>${s}%</strong></div><h2>Business Challenge Complete</h2><p>All scenarios are complete. Here is the final performance profile.</p><div class="cards"><div class="card"><h3>DECISION MAKING</h3><p>${s}%</p></div><div class="card"><h3>INNOVATION THINKING</h3><p>${Math.min(100,s+5)}%</p></div><div class="card"><h3>SUSTAINABILITY</h3><p>${Math.min(100,s+2)}%</p></div></div><br><button class="btn" data-page="home">${tr("home")}</button></div></div>`;bind()}
function career(){return `<div class="panel quiz"><div class="k">CAREER EXPLORER</div><h2>${tr("career")}</h2><p>This interest explorer is designed for exploration, not diagnosis or guaranteed career prediction.</p><button class="btn" id="startCareer">${tr("careerBtn")}</button></div>`}
function history(){let a=records().filter(r=>!user||r.userId===user.id).reverse();return `<div class="panel"><div class="k">PERSONAL DATA</div><h2>${tr("history")}</h2><div class="scroll"><table class="table"><tr><th>Type</th><th>Result</th><th>Date</th></tr>${a.map(r=>`<tr><td>${r.type}</td><td>${r.type==="career"?esc(r.profile):r.score+"%"}</td><td>${new Date(r.date).toLocaleString()}</td></tr>`).join("")||"<tr><td colspan=3>No records yet.</td></tr>"}</table></div></div>`}
function admin(){let p=prompt("Admin password");if(p!==ADMIN_PASSWORD){toast("Access denied");return home()}let a=records(),q=a.filter(x=>x.type==="quiz"),b=a.filter(x=>x.type==="business");return `<div class="panel"><div class="k">SECURE ADMIN AREA</div><h2>TRATA ADMIN COMMAND CENTER</h2><div class="stats"><div class="stat"><b>${new Set(a.map(x=>x.userId)).size}</b><span>USERS</span></div><div class="stat"><b>${q.length}</b><span>QUIZ ATTEMPTS</span></div><div class="stat"><b>${q.length?Math.round(q.reduce((s,x)=>s+x.score,0)/q.length):0}%</b><span>AVG QUIZ</span></div><div class="stat"><b>${b.length?Math.round(b.reduce((s,x)=>s+x.score,0)/b.length):0}%</b><span>AVG BUSINESS</span></div></div><h3 style="margin-top:25px">Recent Quiz Scores</h3><div class="bars">${q.slice(-12).map(x=>`<div class="bar" style="height:${Math.max(7,x.score)}%"><span>${x.score}</span></div>`).join("")}</div><div class="scroll"><table class="table"><tr><th>User</th><th>Type</th><th>Result</th><th>Date</th></tr>${a.slice().reverse().map(x=>`<tr><td>${esc(x.name)}</td><td>${x.type}</td><td>${x.score||x.profile}</td><td>${new Date(x.date).toLocaleString()}</td></tr>`).join("")}</table></div></div>`}
function render(){nav();let f={home,quiz:quizPage,project,business,career,history,admin}[page]||home;document.getElementById("app").innerHTML=`<div class="page">${f()}</div>`;bind()}
function bind(){document.querySelectorAll("[data-page]").forEach(x=>x.onclick=()=>go(x.dataset.page));document.getElementById("homeLang")?.addEventListener("click",()=>{L=L==="en"?"hi":"en";localStorage.setItem(LK,L);render()});document.getElementById("homeLang2")?.addEventListener("click",()=>{L=L==="en"?"hi":"en";localStorage.setItem(LK,L);render()});document.getElementById("startQuiz")?.addEventListener("click",startQuiz);document.querySelectorAll("[data-qi]").forEach(x=>x.onclick=()=>answer(+x.dataset.qi));document.getElementById("next")?.addEventListener("click",nextQ);document.getElementById("startBiz")?.addEventListener("click",startBiz);document.querySelectorAll(".bo").forEach(x=>x.onclick=()=>bizAnswer(x));document.getElementById("menu").onclick=()=>document.getElementById("navwrap").classList.toggle("open");if(page==="project"){let i=0,t=document.getElementById("track"),d=document.querySelectorAll(".dot");let mv=n=>{i=Math.max(0,Math.min(proj.length-1,n));t.style.transform=`translateX(-${i*100}%)`;d.forEach((x,j)=>x.classList.toggle("on",i===j))};document.getElementById("prev").onclick=()=>mv(i-1);document.getElementById("nxt").onclick=()=>mv(i+1);let sx=0;t.ontouchstart=e=>sx=e.touches[0].clientX;t.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)mv(i+(dx<0?1:-1))}}}
document.getElementById("lang").onclick=()=>{L=L==="en"?"hi":"en";localStorage.setItem(LK,L);render()};document.getElementById("save").onclick=()=>{let n=document.getElementById("name").value.trim();if(!n)return;user={id:crypto.randomUUID(),name:n};localStorage.setItem(UK,JSON.stringify(user));document.getElementById("modal").classList.remove("show");let x=pending;pending=null;if(x)x()};document.getElementById("cancel").onclick=()=>document.getElementById("modal").classList.remove("show");
for(let i=0;i<24;i++){let x=document.createElement("i");x.className="p";let s=5+Math.random()*18;x.style.width=s+"px";x.style.height=s+"px";x.style.left=Math.random()*100+"%";x.style.animationDelay=(-Math.random()*12)+"s";x.style.animationDuration=8+Math.random()*10+"s";document.getElementById("fx").appendChild(x)}
setTimeout(()=>{document.getElementById("loading").style.display="none";render()},900);
</script>
</body></html>
